# Shared by every Spark process in the stack (master, workers, history, Jupyter, Airflow).
# Mounted read-only at /opt/spark-conf (SPARK_CONF_DIR).

spark.master                                spark://spark-master:7077

# Keep one app from grabbing the whole cluster, so Jupyter + Airflow can run side by side.
spark.cores.max                             4
spark.executor.cores                        2
spark.executor.memory                       2g
spark.driver.memory                         1g

# Drivers run in client mode inside Jupyter / Airflow; bind on all interfaces,
# advertise the container hostname (= compose service name).
spark.driver.bindAddress                    0.0.0.0

# Drivers (jupyter uid 1000, airflow uid 50000) and executors (spark uid 185) share
# /opt/spark-data on a bind mount that keeps Linux permissions: create everything
# world-writable so any container can write into directories another one created.
spark.hadoop.fs.permissions.umask-mode      000

# Delta Lake
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir                     /opt/spark-data/warehouse

# Event logs -> history server (:18080)
spark.eventLog.enabled                      true
spark.eventLog.dir                          file:///opt/spark-events
spark.history.fs.logDirectory               file:///opt/spark-events

# Prometheus metrics
spark.ui.prometheus.enabled                 true
spark.metrics.conf                          /opt/spark-conf/metrics.properties
spark.metrics.appStatusSource.enabled       true
